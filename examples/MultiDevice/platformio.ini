[env]
lib_extra_dirs = ../..

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3

; Library dependencies
lib_deps =
    ; VictronBLE library will be automatically included from parent directory

; Optional: Specify partition scheme if needed
; board_build.partitions = default.csv

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3

[env:m5stick]
platform = espressif32
board = m5stick-c
framework = arduino
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.partitions = no_ota.csv
#upload_protocol = espota
#upload_port = Button.local
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
#debug_tool = esp-prog ; esp-bridge, esp-prog  ; or ftdi, esp-builtin, jlink, etc.
# debug_speed = 5000     ; optional: JTAG speed in kHz
#build_flags =
#	-DCORE_DEBUG_LEVEL=5    ; ESP32 debug level
#	-O0                      ; no optimization
#	-g3                      ; max debug info
build_flags =
	-Os
lib_deps =
    M5StickC
    elapsedMillis
    TaskScheduler
    Button2
    ArduinoJson
    https://github.com/scottp/PsychicHttp.git


[env:tough]
board = m5stack-core2
board_build.mcu = esp32
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
debug_tool = esp-bridge ; esp-bridge, esp-prog  ; or ftdi, esp-builtin, jlink, etc.
# debug_speed = 5000     ; optional: JTAG speed in kHz
build_flags =
	-DCORE_DEBUG_LEVEL=5    ; ESP32 debug level
	-O0                      ; no optimization
	-g3                      ; max debug info
    -DARDUINO_M5STACK_TOUGH
    -DDISPLAY_WIDTH=320
    -DDISPLAY_HEIGHT=240
    -DHAS_TOUCH=1
    -DBUFFER_LINES=10
lib_deps =
    M5Unified
    elapsedMillis
    TaskScheduler
    Button2
    ArduinoJson
    https://github.com/scottp/PsychicHttp.git
